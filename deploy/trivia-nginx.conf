# nginx config for the `trivia` container (nginx:alpine).
# Mounted at /etc/nginx/conf.d/default.conf — see README "Deployment".
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Keep repo internals off the web
    location ~ /\.(git|github) { deny all; }
    location ~ ^/(deploy|server|README\.md) { deny all; }

    # Shared high scores -> the trivia-scores container on the trivia-net network.
    # The resolver + variable lets nginx start even if trivia-scores is down
    # (the game then just shows "High scores are offline").
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        set $scores http://trivia-scores:8000;
        proxy_pass $scores;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        client_max_body_size 4k;
        proxy_read_timeout 10s;
    }

    # Clips: /api/clip/<token> is answered by trivia-scores with an
    # X-Accel-Redirect to /_audio/<real path>. nginx then streams the file from
    # the audio server, so the browser never sees the file name (which gives
    # away the artist and title). Range requests pass through for seeking.
    location /_audio/ {
        internal;
        set $audio_host audio.iatebreakfast.com;
        rewrite ^/_audio/(.*)$ /$1 break;
        proxy_pass https://$audio_host;
        proxy_set_header Host audio.iatebreakfast.com;
        proxy_set_header Cookie "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_ssl_server_name on;
        proxy_ssl_name audio.iatebreakfast.com;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Cache-Control "private, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
