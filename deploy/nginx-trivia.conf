# trivia.iatebreakfast.com — static site behind Cloudflare Tunnel
server {
    listen 127.0.0.1:8093;
    server_name trivia.iatebreakfast.com;

    root /var/www/trivia;
    index index.html;

    # Keep the repo's metadata off the web
    location ~ /\.(git|github) { deny all; }
    location ~ ^/(deploy|README\.md) { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
